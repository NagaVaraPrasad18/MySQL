name: Generate SQL Snippets JSON
on:
  push:
    branches: [ main ]
jobs:
  generate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Install node-fetch
        run: npm install node-fetch@2
      - name: Generate snippets.json
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generate-snippets.js
      - name: Commit snippets.json
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add snippets.json
          git commit -m "Update snippets.json with SQL file data" || echo "No changes to commit"
          git push
