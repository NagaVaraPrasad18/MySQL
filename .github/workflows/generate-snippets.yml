name: Generate SQL Snippets JSON
on:
  push:
    branches: [ main ]
jobs:
  generate-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Explicitly grant write access for GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # Use GITHUB_TOKEN for checkout
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Install node-fetch
        run: npm install node-fetch@2
      - name: Generate snippets.json
        env:
          REPO: ${{ github.repository }}  # e.g., NagaVaraPrasad18/MySQL
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generate-snippets.js
      - name: Commit and push snippets.json
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
